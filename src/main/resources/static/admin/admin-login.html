<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | Food Rescue</title>
    <style>
        /* Reset some default styles */
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* Body styling */
        body {
          font-family: 'Arial', sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          overflow: hidden;
        }

        /* Add subtle background animation */
        body::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.05"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
          animation: float 20s ease-in-out infinite;
          pointer-events: none;
        }

        /* Form container */
        form {
          background-color: rgba(255, 255, 255, 0.95);
          backdrop-filter: blur(10px);
          padding: 40px;
          border-radius: 15px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
          width: 350px;
          position: relative;
          animation: fadeInUp 1s ease-out;
          border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Heading */
        h2 {
          text-align: center;
          margin-bottom: 30px;
          color: #333;
          font-size: 1.8rem;
          animation: slideDown 0.8s ease-out 0.2s both;
        }

        /* Labels */
        label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: #555;
          animation: fadeIn 0.6s ease-out 0.4s both;
        }

        /* Input fields */
        input[type="text"],
        input[type="password"] {
          width: 100%;
          padding: 12px 15px;
          margin-bottom: 20px;
          border: 2px solid #e0e0e0;
          border-radius: 8px;
          font-size: 16px;
          transition: all 0.3s ease;
          background-color: #f9f9f9;
          animation: slideUp 0.6s ease-out 0.6s both;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
          border-color: #667eea;
          outline: none;
          transform: translateY(-2px);
          box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
          background-color: white;
        }

        /* Submit button */
        button {
          width: 100%;
          padding: 14px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: #fff;
          border: none;
          border-radius: 8px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
          animation: fadeIn 0.6s ease-out 0.8s both;
        }

        button::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
          transition: left 0.5s;
        }

        button:hover {
          transform: translateY(-3px);
          box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
          background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }

        button:hover::before {
          left: 100%;
        }

        button:active {
          transform: translateY(-1px);
        }

        /* Paragraph and links */
        p {
          text-align: center;
          margin-top: 15px;
          color: #666;
          font-size: 14px;
          animation: fadeIn 0.6s ease-out 1s both;
        }

        a {
          color: #667eea;
          text-decoration: none;
          font-weight: bold;
          transition: color 0.3s ease;
        }

        a:hover {
          color: #764ba2;
          text-decoration: underline;
          transform: scale(1.05);
        }

        /* Animations */
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes slideDown {
          from {
            transform: translateY(-20px);
            opacity: 0;
          }
          to {
            transform: translateY(0);
            opacity: 1;
          }
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }

        @keyframes slideUp {
          from {
            transform: translateY(10px);
            opacity: 0;
          }
          to {
            transform: translateY(0);
            opacity: 1;
          }
        }

        @keyframes float {
          0%, 100% {
            transform: translateY(0px);
          }
          50% {
            transform: translateY(-10px);
          }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
          form {
            width: 90%;
            padding: 30px 20px;
            margin: 20px;
          }

          h2 {
            font-size: 1.5rem;
          }

          input[type="text"],
          input[type="password"] {
            padding: 10px;
            margin-bottom: 15px;
          }

          button {
            padding: 12px;
          }
        }
    </style>
</head>
<body>
<form th:action="@{/login}" method="post">
    <h2>Admin Login</h2>
    <label>Email:</label>
    <input type="text" name="username" required>
    <label>Password:</label>
    <input type="password" name="password" required>
    <button type="submit">Login</button>
    <p>Don’t have an account? <a th:href="@{/register/admin}">Sign up</a></p>
    <p><a th:href="@{/start}">⬅ Back</a></p>
</form>
</body>
</html>
