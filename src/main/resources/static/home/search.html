<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header.html :: head (title='User  - Search Results')}"></head>
<body>
<div th:insert="~{fragments/navbar.html :: navbar(role='USER')}"></div>

<div class="container mt-4" sec:authorize="hasRole('USER')">
  <h2>Search Results</h2>
  <p th:if="${param.keyword}">Showing results for "<span th:text="${param.keyword}"></span>"</p>
  <p th:if="${param.location}">in "<span th:text="${param.location}"></span>"</p>

  <!-- Refine Search Form -->
  <form th:action="@{/user/search}" method="get" class="mb-4">
    <div class="input-group">
      <input type="text" class="form-control" name="keyword" placeholder="Refine search..." th:value="${param.keyword}">
      <input type="text" class="form-control" name="location" placeholder="Location" th:value="${param.location}" style="border-left: none;">
      <button class="btn btn-primary" type="submit">Search Again</button>
    </div>
  </form>

  <div th:if="${searchResults == null or searchResults.isEmpty()}" class="alert alert-warning">
    No results found. Try a broader search term.
    <a th:href="@{/user/explore}" class="btn btn-link">Browse All</a>
  </div>

  <!-- Results Grid -->
  <div class="row">
    <div th:each="food : ${searchResults}" class="col-md-6 mb-3">
      <div class="card">
        <div class="row g-0">
          <div class="col-md-4">
            <img th:src="${food.imageUrl ?: '/images/food1.jpg'}" class="img-fluid rounded-start" alt="Food" style="height: 100%; object-fit: cover;">
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5 class="card-title" th:text="${food.title}">Search Result</h5>
              <p class="card-text" th:text="${food.description}">Description</p>
              <small class="text-muted">Location: <span th:text="${food.location}">Loc</span> | Expires: <span th:text="${food.expiryDate}">Date</span></small>
              <a th:href="@{/food/view/{id}(id=${food.id})}" class="btn btn-success btn-sm mt-2">Claim This</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <nav th:if="${totalPages > 1}" class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}">
        <a class="page-link" th:href="@{/user/search(keyword=${param.keyword}, location=${param.location}, page=${pageNum})}" th:text="${pageNum}">1</a>
      </li>
    </ul>
  </nav>

  <a th:href="@{/user/explore}" class="btn btn-outline-secondary mt-3">Back to Explore</a>
</div>

<div th:replace="~{fragments/footer.html}"></div>
<link th:href="@{/css/home.css}" rel="stylesheet">
</body>
</html>
