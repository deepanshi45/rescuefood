<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<footer th:fragment="footer" class="footer">
  <div class="container">
    <div class="row">
      <div class="col-md-4">
        <h5 class="footer-title">Food Rescue</h5>
        <p>Helping reduce food waste by connecting donors with those in need.</p>
        <img th:src="@{/images/logo.png}" alt="Logo" class="footer-logo" width="100">
      </div>
      <div class="col-md-4">
        <h6>Quick Links</h6>
        <ul class="footer-links">
          <li><a href="/user/home">Home</a></li>
          <li><a href="/user/explore">Explore Food</a></li>
          <li><a href="/user/about">About</a></li>
          <li><a href="/feedback">Feedback</a></li>
        </ul>
      </div>
      <div class="col-md-4">
        <h6>Contact Us</h6>
        <p><i class="fas fa-envelope"></i> info@foodrescue.com</p>
        <p><i class="fas fa-phone"></i> +1 (123) 456-7890</p>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </div>
    <hr>
    <div class="text-center">
      <p>&copy; 2024 Food Rescue. All rights reserved. | <a href="/privacy">Privacy Policy</a></p>
    </div>
  </div>

  <!-- Footer Animation CSS (embedded) -->
  <style>
    .footer {
        background-color: #343a40;
        color: white;
        padding: 2rem 0 1rem;
        margin-top: 3rem;
        animation: slideUpFooter 1s ease-out 0.5s both;
    }

    @keyframes slideUpFooter {
        from {
            opacity: 0;
            transform: translateY(50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .footer-title {
        color: #28a745;
        animation: fadeIn 1s ease-in;
    }

    .footer-links {
        list-style: none;
        padding: 0;
    }

    .footer-links a {
        color: #adb5bd;
        text-decoration: none;
        transition: color 0.3s ease;
    }

    .footer-links a:hover {
        color: #28a745;
        transform: translateX(5px);
    }

    .social-icons a {
        color: white;
        font-size: 1.5rem;
        margin: 0 10px;
        transition: all 0.3s ease;
    }

    .social-icons a:hover {
        color: #28a745;
        transform: scale(1.2) rotate(10deg);
    }

    .footer-logo {
        border-radius: 50%;
        transition: transform 0.3s ease;
    }

    .footer-logo:hover {
        transform: rotate(360deg);
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
  </style>
</footer>
</html>
