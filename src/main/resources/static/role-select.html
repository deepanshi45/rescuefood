<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Role | Food Rescue</title>
    <style>
        /* Reset default styles */
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        /* Body styling */
        body {
          font-family: 'Arial', sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          overflow: hidden;
        }

        /* Add subtle background animation */
        body::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.05"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
          animation: float 20s ease-in-out infinite;
          pointer-events: none;
        }

        /* Card container */
        .card {
          background-color: rgba(255, 255, 255, 0.95);
          backdrop-filter: blur(10px);
          border-radius: 15px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
          padding: 40px;
          text-align: center;
          width: 350px;
          position: relative;
          animation: fadeInUp 1s ease-out;
          border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Heading */
        h1 {
          color: #333;
          font-size: 2rem;
          margin-bottom: 10px;
          animation: slideDown 0.8s ease-out 0.2s both;
        }

        /* Paragraph */
        p {
          color: #666;
          font-size: 1.1rem;
          margin-bottom: 30px;
          animation: fadeIn 0.6s ease-out 0.4s both;
        }

        /* Role buttons container */
        .role-buttons {
          display: flex;
          flex-direction: column;
          gap: 15px;
          animation: fadeIn 0.6s ease-out 0.6s both;
        }

        /* Role buttons (styled as links) */
        .role-btn {
          display: block;
          padding: 14px 20px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          text-decoration: none;
          border-radius: 8px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
          text-align: center;
        }

        .role-btn::before {
          content: '';
          position: absolute;
          top: 0;
          left: -100%;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
          transition: left 0.5s;
        }

        .role-btn:hover {
          transform: translateY(-3px);
          box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
          background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
          color: white;
        }

        .role-btn:hover::before {
          left: 100%;
        }

        .role-btn:active {
          transform: translateY(-1px);
        }

        /* Icons for buttons (Unicode for simplicity) */
        .user-btn::before { content: "👤 "; }  /* User icon */
        .admin-btn::before { content: "👨‍💼 "; }  /* Admin icon */

        /* Animations */
        @keyframes fadeInUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes slideDown {
          from {
            transform: translateY(-20px);
            opacity: 0;
          }
          to {
            transform: translateY(0);
            opacity: 1;
          }
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
          }
          to {
            opacity: 1;
          }
        }

        @keyframes float {
          0%, 100% {
            transform: translateY(0px);
          }
          50% {
            transform: translateY(-10px);
          }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
          .card {
            width: 90%;
            padding: 30px 20px;
            margin: 20px;
          }

          h1 {
            font-size: 1.6rem;
          }

          p {
            font-size: 1rem;
          }

          .role-btn {
            padding: 12px 16px;
            font-size: 15px;
          }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome to Food Rescue</h1>
    <p>Select your role to continue</p>
    <div class="role-buttons">
        <!-- Link to User Login Page -->
        <a th:href="@{/login/user}" class="role-btn user-btn">User </a>

        <!-- Link to Admin Login Page -->
        <a th:href="@{/login/admin}" class="role-btn admin-btn">Admin</a>
    </div>
</div>
</body>
</html>
