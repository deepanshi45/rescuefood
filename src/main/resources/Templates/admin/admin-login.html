<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .bg-food-orange { background-color: #EA580C; }
        .text-food-dark { color: #14532D; }
        .border-food-orange { border-color: #EA580C; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-poppins">

<div class="w-full max-w-md">
    <div class="bg-white p-8 rounded-xl shadow-2xl border-t-4 border-food-orange">

        <div class="text-center mb-6">
            <i class="bi bi-shop text-5xl text-food-orange mb-2"></i>
            <h2 class="text-3xl font-bold text-food-dark">Admin Sign In</h2>
            <p class="text-gray-500">Manage donations and platform users.</p>
        </div>

        <!-- Error Messages -->
        <div th:if="${param.error}" class="p-3 mb-4 bg-red-100 text-red-700 rounded-lg">
            Invalid credentials or insufficient permissions.
        </div>
        <div th:if="${param.logout}" class="p-3 mb-4 bg-green-100 text-green-700 rounded-lg">
            You have been logged out.
        </div>

        <!-- Login Form -->
        <form th:action="@{/perform_login}" method="post" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email (Login ID)</label>
                <input type="email" id="email" name="email" required
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-food-orange focus:border-food-orange">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" required
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-food-orange focus:border-food-orange">
            </div>

            <button type="submit" class="w-full bg-food-orange text-white px-5 py-3 rounded-lg text-lg font-bold hover:bg-orange-700 transition shadow-lg">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            New Donor/Admin?
            <a th:href="@{/admin/register}" class="text-food-orange hover:underline font-semibold">Register Here</a>
        </div>
        <div class="mt-3 text-center text-sm">
            <a th:href="@{/role-select}" class="text-gray-500 hover:text-gray-700 transition">⬅ Back to Role Select</a>
        </div>
    </div>
</div>

</body>
</html>
