<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Account Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .bg-food-dark { color: #14532D; }
    .bg-food-orange { background-color: #EA580C; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
  <h1 class="text-2xl font-bold text-food-dark">Account Settings</h1>
  <a th:href="@{/admin/dashboard}" class="text-gray-500 hover:text-food-dark transition">← Back to Dashboard</a>
</header>

<main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-xl max-w-2xl">
  <h2 class="text-3xl font-bold text-food-dark mb-6 border-b pb-2">Admin Profile Information</h2>

  <div th:if="${success}" class="p-3 bg-green-100 text-green-700 rounded-lg mb-4" th:text="${success}">Settings updated successfully!</div>
  <div th:if="${error}" class="p-3 bg-red-100 text-red-700 rounded-lg mb-4" th:text="${error}">Error occurred.</div>

  <div class="space-y-4 pt-4">
    <h3 class="text-xl font-semibold text-gray-700 flex items-center gap-2"><i class="bi bi-info-circle"></i> Profile Details (Static)</h3>

    <div class="bg-gray-50 p-4 rounded-lg">
      <p class="text-sm font-medium text-gray-600">Organization Name</p>
      <p class="text-lg font-semibold text-food-dark">Hotel Sunshine (Placeholder)</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-lg">
      <p class="text-sm font-medium text-gray-600">Email (Login ID)</p>
      <p class="text-lg font-semibold text-food-dark">admin@hotel.com (Placeholder)</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-lg">
      <p class="text-sm font-medium text-gray-600">Phone</p>
      <p class="text-lg font-semibold text-food-dark">9988776655 (Placeholder)</p>
    </div>

    <div class="pt-4">
      <a th:href="@{/admin/dashboard}" class="bg-food-orange text-white px-6 py-2 rounded-lg hover:bg-orange-700 transition inline-flex items-center gap-2">
        <i class="bi bi-check-lg"></i> Done
      </a>
    </div>
  </div>

</main>
</body>
</html>
