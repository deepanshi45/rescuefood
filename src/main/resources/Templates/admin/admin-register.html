<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin/Donor Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .font-poppins { font-family: 'Poppins', sans-serif; }
        .bg-food-orange { background-color: #EA580C; }
        .text-food-dark { color: #14532D; }
        .border-food-orange { border-color: #EA580C; }
        .bg-food-green { background-color: #16A34A; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-poppins">

<div class="w-full max-w-md">
    <div class="bg-white p-8 rounded-xl shadow-2xl border-t-4 border-food-orange">

        <div class="text-center mb-6">
            <i class="bi bi-person-plus text-5xl text-food-orange mb-2"></i>
            <h2 class="text-3xl font-bold text-food-dark">Donor Registration</h2>
            <p class="text-gray-500">Sign up to post food surpluses.</p>
        </div>

        <!-- Success & Error messages -->
        <div th:if="${success}" class="p-3 mb-4 bg-green-100 text-green-700 rounded-lg" th:text="${success}"></div>
        <div th:if="${error}" class="p-3 mb-4 bg-red-100 text-red-700 rounded-lg" th:text="${error}"></div>

        <!-- Registration Form -->
        <form th:action="@{/admin/register}" th:object="${adminDTO}" method="post" class="space-y-4">

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Organization Name</label>
                <input type="text" id="name" th:field="*{name}" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-food-orange focus:border-food-orange">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" th:field="*{email}" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-food-orange focus:border-food-orange">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" th:field="*{password}" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-food-orange focus:border-food-orange">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <button type="submit" class="w-full bg-food-orange text-white px-5 py-3 rounded-lg text-lg font-bold hover:bg-orange-700 transition shadow-lg">
                Register as Donor
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            Already registered?
            <a th:href="@{/admin/login}" class="text-food-orange hover:underline font-semibold">Login Here</a>
        </div>
    </div>
</div>
</body>
</html>
