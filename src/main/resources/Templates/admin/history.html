<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Rescue History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-food-dark { color: #14532D; }
    .font-poppins { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
  <h1 class="text-2xl font-bold text-food-dark">Rescue History</h1>
  <a th:href="@{/admin/dashboard}" class="text-gray-500 hover:text-food-dark transition">← Back to Dashboard</a>
</header>

<main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-xl">
  <h2 class="text-3xl font-bold text-food-dark mb-6 border-b pb-2">Completed Orders & Logs</h2>

  <div th:if="${history == null or history.isEmpty()}" class="p-4 bg-blue-100 text-blue-700 rounded-lg">
    No past rescue history or completed orders found.
  </div>

  <div class="overflow-x-auto">
    <table th:if="${history != null and !history.isEmpty()}" class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-200">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Order ID</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Food Item</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Claimed By</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Status</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Date</th>
      </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
      <tr>
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">#1201</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Vegetable Curry</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">user@ngo.org</td>
        <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-700">COMPLETED</span></td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">2025-11-10</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
