<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Food Listings Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Tailwind colors for a food/green theme */
        .bg-food-green { background-color: #16A34A; }
        .text-food-dark { color: #14532D; }
        .bg-food-light { background-color: #DCFCE7; }
        /* A common web font for better look */
        .font-poppins { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
    <h1 class="text-2xl font-bold text-food-dark">Food Listings Review</h1>
    <a th:href="@{/admin/dashboard}" class="text-gray-500 hover:text-food-dark transition">← Back to Dashboard</a>
</header>

<main class="container mx-auto mt-8 p-6 bg-white rounded-lg shadow-xl">
    <h2 class="text-3xl font-bold text-food-dark mb-6 border-b pb-2">Active Food Items</h2>

    <form th:action="@{/admin/explore/search}" method="get" class="mb-6 p-4 border rounded-lg bg-gray-50">
        <div class="flex space-x-4">
            <input type="text" name="query" placeholder="Search by item, donor, or location..."
                   class="flex-grow px-4 py-2 border rounded-lg focus:ring-food-green focus:border-food-green">
            <button type="submit" class="bg-food-green text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">Search</button>
        </div>
    </form>

    <div class="overflow-x-auto">
        <table th:if="${foods != null and !foods.isEmpty()}" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-food-light">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-food-dark uppercase tracking-wider">Item</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-food-dark uppercase tracking-wider">Quantity</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-food-dark uppercase tracking-wider">Donar/Admin ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-food-dark uppercase tracking-wider">user name</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-red-700 uppercase tracking-wider">Expiry Date</th>
                <th class="px-6 py-3 text-center">Actions</th>
            </tr>
            </thead>

            <tbody class="bg-white divide-y divide-gray-200">
            <tr th:each="food : ${foods}">
                <td th:text="${food.title}" class="px-6 py-4 whitespace-nowrap text-sm font-medium">Example Item</td>

                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    <span th:text="${food.quantity}">20</span> <span th:text="${food.unit}">Dozen</span>
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    <span th:text="${food.postedBy.name} ?: 'ID: ' + ${food.postedBy.id}">Hotel Name</span>
                </td>

                <td th:text="${food.expiryDate}" class="px-6 py-4 whitespace-nowrap text-sm text-red-500">2025-12-31</td>

                <!-- Actions column with dynamic status -->
                <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                    <div th:switch="${food.status}">
                        <!-- Claimed status: Accept/Decline buttons -->
                        <span th:case="'CLAIMED'">
                            <form th:action="@{/admin/food/status/{id}(id=${food.id})}" method="post" class="inline-block mr-2">
                                <input type="hidden" name="action" value="ACCEPT"/>
                                <button type="submit" class="bg-food-green text-white px-2 py-1 rounded-md text-xs hover:bg-green-700">Accept</button>
                            </form>

                            <form th:action="@{/admin/food/status/{id}(id=${food.id})}" method="post" class="inline-block">
                                <input type="hidden" name="action" value="DECLINE"/>
                                <button type="submit" class="bg-red-500 text-white px-2 py-1 rounded-md text-xs hover:bg-red-700">Decline</button>
                            </form>
                        </span>

                        <!-- Available status: Edit/Close Listing links -->
                        <span th:case="'AVAILABLE'">
                            <a th:href="@{/admin/food/edit/{id}(id=${food.id})}" class="text-blue-600 hover:text-blue-900 mr-3">Edit</a>
                            <a th:href="@{/admin/food/close/{id}(id=${food.id})}" class="text-red-500 hover:text-red-700">Close Listing</a>
                        </span>

                        <!-- Any other status: just display status -->
                        <span th:case="*">
                            <span class="text-gray-400" th:text="${food.status}"></span>
                        </span>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(foods)}">
                <td colspan="5" class="px-6 py-4 text-center text-gray-500">No active food listings found.</td>
            </tr>
            </tbody>
        </table>

        <div th:if="${foods == null or foods.isEmpty()}" class="p-4 bg-yellow-100 text-yellow-700 rounded-lg text-center">
            No active food listings found.
        </div>
    </div>
</main>
</body>
</html>
