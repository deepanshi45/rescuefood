<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Food Rescue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'food-green': '#16A34A',
                        'food-dark': '#14532D',
                        'food-light': '#DCFCE7',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-food-light to-food-green min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full border border-food-green/30">
    <h2 class="text-3xl font-bold text-food-dark text-center mb-6">User Login</h2>

    <form th:action="@{/perform_login}" method="post">

        <div th:if="${param.error}" class="bg-red-100 text-red-700 p-3 rounded-md mb-4 border border-red-300">
            Invalid email or password. Please try again.
        </div>

        <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-gray-700 text-left mb-1">Email (Login ID)</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-food-green">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700 text-left mb-1">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-food-green">
        </div>

        <button type="submit" class="w-full bg-food-green hover:bg-food-dark text-white font-semibold py-3 rounded-lg transition duration-300 ease-in-out transform hover:scale-[1.01] shadow-lg">
            Sign In as User
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account?
        <a th:href="@{/user/register}" class="text-food-green hover:underline font-medium">Sign up here</a>
    </p>
    <p class="text-center text-sm mt-3">
        <a th:href="@{/role-select}" class="text-gray-500 hover:text-gray-700 transition">⬅ Back to Role Select</a>
    </p>
</div>
</body>
</html>
