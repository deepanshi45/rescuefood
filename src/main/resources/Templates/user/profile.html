<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style> .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-blue-600">My Profile</h1>
  <a th:href="@{/user/homepage}" class="text-gray-500 hover:text-blue-600"><i class="bi bi-arrow-left"></i> Back to Home</a>
</header>

<main class="container mx-auto p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-2xl border-t-4 border-blue-500">

    <div class="text-center mb-6">
      <i class="bi bi-person-circle text-6xl text-blue-500"></i>
      <h2 class="text-3xl font-bold text-gray-800 mt-3" th:text="${user.name}">Jane Doe</h2>
      <p class="text-gray-500">@<span th:text="${user.username}">username</span></p>
    </div>

    <div class="space-y-4">
      <div class="flex items-center p-3 bg-blue-50 rounded-lg">
        <i class="bi bi-envelope text-xl text-blue-600 mr-4"></i>
        <div>
          <p class="text-sm font-medium text-gray-500">Email Address</p>
          <p class="text-lg font-semibold text-gray-800" th:text="${user.email}">jane.doe@example.com</p>
        </div>
      </div>

      <div class="flex items-center p-3 bg-blue-50 rounded-lg">
        <i class="bi bi-telephone text-xl text-blue-600 mr-4"></i>
        <div>
          <p class="text-sm font-medium text-gray-500">Phone Number</p>
          <p class="text-lg font-semibold text-gray-800" th:text="${user.phone != null and !user.phone.isEmpty()} ? ${user.phone} : 'Not provided'">+91 98765 43210</p>
        </div>
      </div>

      <div class="flex items-center p-3 bg-blue-50 rounded-lg">
        <i class="bi bi-geo-alt text-xl text-blue-600 mr-4"></i>
        <div>
          <p class="text-sm font-medium text-gray-500">Primary Location</p>
          <p class="text-lg font-semibold text-gray-800" th:text="${user.address != null and !user.address.isEmpty()} ? ${user.address} : 'Not provided'">New Delhi, India</p>
        </div>
      </div>
    </div>

    <div class="mt-8 flex justify-end gap-3">
      <a th:href="@{/user/settings}" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-lg font-medium hover:bg-gray-300 transition">
        <i class="bi bi-gear mr-2"></i> Edit Settings
      </a>
      <a th:href="@{/logout}" class="bg-red-500 text-white px-5 py-2 rounded-lg font-medium hover:bg-red-600 transition">
        <i class="bi bi-box-arrow-right mr-2"></i> Logout
      </a>
    </div>
  </div>
</main>
</body>
</html>
