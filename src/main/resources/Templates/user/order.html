<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style> .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-yellow-600">My Food Claims</h1>
    <a th:href="@{/user/homepage}" class="text-gray-500 hover:text-yellow-600">
        <i class="bi bi-arrow-left"></i> Back to Home
    </a>
</header>

<main class="container mx-auto p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-semibold text-gray-800 mb-6 border-b pb-2">Recent Orders</h2>

        <div th:fragment="status-tag(status)">
            <span th:class="${status == 'DONATED'}
                       ? 'inline-block px-3 py-1 text-xs font-semibold rounded-full uppercase bg-green-100 text-green-700'
                       : ( ${status == 'CLAIMED'}
                           ? 'inline-block px-3 py-1 text-xs font-semibold rounded-full uppercase bg-blue-100 text-blue-700'
                           : 'inline-block px-3 py-1 text-xs font-semibold rounded-full uppercase bg-red-100 text-red-700' )"
                  th:text="${status}">CLAIMED</span>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="p-8 bg-blue-100 text-blue-700 rounded-lg text-center">
            You haven't claimed any food yet. Explore the available items!
        </div>

        <div th:unless="${#lists.isEmpty(orders)}" class="space-y-6">
            <div th:each="order : ${orders}"
                 class="bg-white p-5 rounded-xl shadow-lg flex justify-between items-start transition duration-300 hover:shadow-xl">

                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-1" th:text="${order.title}">Food Item Title</h3>

                    <p class="text-sm text-gray-500 mb-2">Item ID: <span th:text="${order.id}">#87654</span></p>

                    <p class="text-sm text-gray-700">
                        Quantity: <span th:text="${order.quantity}">5</span>
                        <span th:text="${order.unit}">kg</span>
                    </p>

                    <p class="text-sm text-gray-700">
                        Pickup Location: <span th:text="${order.location}">Central Hotel</span>
                    </p>
                </div>

                <div class="text-right">
                    <div th:replace="~{::status-tag(status=${order.status})}" class="mb-3"></div>

                    <a th:href="@{/user/order/details/{id}(id=${order.id})}"
                       class="text-sm text-blue-500 hover:text-blue-700 font-medium block">
                        View Details <i class="bi bi-chevron-right"></i>
                    </a>
                </div>

            </div>
        </div>
    </div>
</main>

</body>
</html>
