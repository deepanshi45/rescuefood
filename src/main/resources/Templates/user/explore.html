<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Food Items</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style> .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-green-600">Available Food</h1>
    <a th:href="@{/user/homepage}" class="text-gray-500 hover:text-green-600"><i class="bi bi-arrow-left"></i> Back to Home</a>
</header>

<main class="container mx-auto p-4 md:p-8">

    <form th:action="@{/user/explore}" method="get" class="bg-white p-6 rounded-xl shadow-lg mb-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" name="keyword" placeholder="Search item or location..." class="col-span-2 p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
            <select name="category" class="p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
                <option value="">All Categories</option>
                <option value="BAKERY">Bakery</option>
                <option value="FRUITS">Fruits & Veg</option>
                <option value="OTHER">Other</option>
            </select>
            <button type="submit" class="bg-green-500 text-white font-semibold py-3 rounded-lg hover:bg-green-600 transition">
                <i class="bi bi-search mr-2"></i> Search
            </button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(foods)}" class="p-8 bg-yellow-100 text-yellow-700 rounded-lg text-center">
        No food items are available right now. Please check back later!
    </div>

    <div th:unless="${#lists.isEmpty(foods)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="food : ${foods}" class="bg-white rounded-xl shadow-lg overflow-hidden transform hover:scale-[1.02] transition duration-300">
            <img th:src="@{/images/{id}(id=${food.id})}" alt="Food Image" class="w-full h-48 object-cover">
            <div class="p-5">
                <h3 class="text-xl font-bold text-green-600 mb-2" th:text="${food.title}">5KG Fresh Bread Loaves</h3>
                <p class="text-gray-600 text-sm mb-3" th:text="${food.description}">Surplus from morning bake. Ready for immediate pickup.</p>
                <div class="flex justify-between items-center border-t pt-3">
                    <span class="text-lg font-semibold text-gray-800" th:text="${food.quantity} + ' ' + ${food.unit}">5 kg</span>
                    <a th:href="@{/user/claim/{id}(id=${food.id})}" class="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-600 transition">
                        Claim <i class="bi bi-bag-plus"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
