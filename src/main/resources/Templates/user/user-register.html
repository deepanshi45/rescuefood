<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Signup | Food Rescue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Tailwind Configuration (for theme colors) */
        .bg-food-green { background-color: #16A34A; }
        .text-food-dark { color: #14532D; }
        .border-food-green { border-color: #16A34A; }
        .bg-food-light { background-color: #DCFCE7; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-food-light to-food-green min-h-screen flex items-center justify-center p-4 font-poppins">

<div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full border border-blue-500/30">
    <h2 class="text-3xl font-bold text-blue-600 text-center mb-6">User Signup</h2>

    <form th:action="@{/user/register}" th:object="${userDTO}" method="post" class="space-y-4">

        <div th:if="${success}" class="bg-green-100 text-green-700 p-3 rounded-md mb-4 border border-green-300" th:text="${success}">Registration successful!</div>
        <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded-md mb-4 border border-red-300" th:text="${error}">Error occurred during registration.</div>

        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 text-left mb-1">Full Name</label>
            <input type="text" id="name" th:field="*{name}" required placeholder="Enter your full name"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1"></p>
        </div>

        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 text-left mb-1">Username</label>
            <input type="text" id="username" th:field="*{username}" required placeholder="Choose a username"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-red-500 text-xs mt-1"></p>
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 text-left mb-1">Email</label>
            <input type="email" id="email" th:field="*{email}" required placeholder="Enter your email address"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1"></p>
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 text-left mb-1">Password</label>
            <input type="password" id="password" th:field="*{password}" required placeholder="Choose a password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1"></p>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-300 ease-in-out shadow-lg">
            Register Account
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
        Already have an account?
        <a th:href="@{/user/login}" class="text-blue-600 hover:underline font-medium">Login here</a>
    </p>
    <p class="text-center text-sm mt-3">
        <a th:href="@{/role-select}" class="text-gray-500 hover:text-gray-700 transition">⬅ Back to Role Select</a>
    </p>
</div>
</body>
</html>
