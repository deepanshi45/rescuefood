<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Documents & Files</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style> .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center">
  <h1 class="text-2xl font-bold text-gray-700">My Files</h1>
  <a th:href="@{/user/homepage}" class="text-gray-500 hover:text-gray-700"><i class="bi bi-arrow-left"></i> Back to Home</a>
</header>

<main class="container mx-auto p-4 md:p-8">
  <div class="max-w-3xl mx-auto space-y-4">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Uploaded Documents</h2>

    <div th:if="${#lists.isEmpty(userFiles)}" class="p-4 bg-blue-100 text-blue-700 rounded-lg">
      No files have been uploaded yet.
    </div>

    <div th:unless="${#lists.isEmpty(userFiles)}" th:each="file : ${userFiles}" class="bg-white p-4 rounded-lg shadow flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="bi bi-file-earmark-text text-2xl text-indigo-500"></i>
        <div>
          <p class="font-medium text-gray-800" th:text="${file.name}">Permit_2025.pdf</p>
          <p class="text-xs text-gray-500" th:text="'Uploaded: ' + ${#dates.format(file.date, 'dd MMM yyyy')}">Uploaded: 15 Jan 2025</p>
        </div>
      </div>
      <a th:href="@{/user/files/download/{id}(id=${file.id})}" class="text-indigo-500 hover:text-indigo-700 font-medium">
        Download <i class="bi bi-download"></i>
      </a>
    </div>
  </div>
</main>
</body>
</html>
