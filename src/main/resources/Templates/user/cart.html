<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Current Claims</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style> .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-600">My Current Claims</h1>
    <a th:href="@{/user/homepage}" class="text-gray-500 hover:text-blue-600"><i class="bi bi-arrow-left"></i> Back to Home</a>
</header>

<main class="container mx-auto p-4 md:p-8">
    <div class="max-w-3xl mx-auto space-y-6">

        <div th:if="${#lists.isEmpty(currentClaims)}" class="p-8 bg-yellow-100 text-yellow-700 rounded-lg text-center shadow-md">
            You have no pending claims. <a th:href="@{/user/explore}" class="text-yellow-600 font-semibold hover:underline">Explore food now!</a>
        </div>

        <div th:unless="${#lists.isEmpty(currentClaims)}" th:each="claim : ${currentClaims}" class="bg-white p-5 rounded-xl shadow-lg flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <i class="bi bi-basket text-4xl text-blue-500"></i>
                <div>
                    <h3 class="text-lg font-bold text-gray-800" th:text="${claim.foodItem.title}">5 kg Fresh Tomatoes</h3>
                    <p class="text-sm text-gray-500">Qty: <span th:text="${claim.claimedQuantity}">5</span> <span th:text="${claim.foodItem.unit}">kg</span></p>
                    <p class="text-sm text-red-500">Pickup before: <span th:text="${#dates.format(claim.foodItem.expiryDate, 'dd MMM - hh:mm a')}">10 Mar - 7:00 PM</span></p>
                </div>
            </div>

            <div class="text-right">
                <a th:href="@{/user/claim/view/{id}(id=${claim.id})}" class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">
                    View Details
                </a>
                <form th:action="@{/user/claim/cancel/{id}(id=${claim.id})}" method="post" class="inline-block ml-2">
                    <button type="submit" class="text-red-500 hover:text-red-700 text-sm font-medium">Cancel</button>
                </form>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(currentClaims)}" class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-green-500 text-center">
            <p class="text-xl font-semibold text-gray-800 mb-4">Ready for Pickup?</p>
            <a th:href="@{/user/checkout}" class="bg-green-500 text-white px-8 py-3 rounded-lg text-lg font-bold hover:bg-green-600 transition shadow-lg-green">
                Confirm Pickup Details
            </a>
        </div>
    </div>
</main>
</body>
</html>
