<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style> .font-poppins { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-purple-600">Feedback & Support</h1>
    <a th:href="@{/user/homepage}" class="text-gray-500 hover:text-purple-600"><i class="bi bi-arrow-left"></i> Back to Home</a>
</header>

<main class="container mx-auto p-4 md:p-8">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-2xl border-t-4 border-purple-500">

        <div class="text-center mb-6">
            <i class="bi bi-chat-dots text-6xl text-purple-500"></i>
            <h2 class="text-3xl font-bold text-gray-800 mt-3">Tell Us What You Think</h2>
            <p class="text-gray-500">Your feedback helps us rescue more food effectively.</p>
        </div>

        <form th:action="@{/user/submitFeedback}" method="post" class="space-y-6">

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Your Name</label>
                <input type="text" id="name" name="name" th:value="${#authentication.principal.username}" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
            </div>

            <div>
                <label for="rating" class="block text-sm font-medium text-gray-700">Overall Rating</label>
                <select id="rating" name="rating" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
                    <option value="">-- Select Rating --</option>
                    <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                    <option value="4">⭐⭐⭐⭐ Good</option>
                    <option value="3">⭐⭐⭐ Average</option>
                    <option value="2">⭐⭐ Poor</option>
                    <option value="1">⭐ Very Poor</option>
                </select>
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-700">Message/Issue Description</label>
                <textarea id="message" name="message" rows="4" required class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500"></textarea>
            </div>

            <button type="submit" class="w-full bg-purple-500 text-white px-5 py-3 rounded-lg text-lg font-bold hover:bg-purple-600 transition shadow-lg-green">
                Submit Feedback <i class="bi bi-send"></i>
            </button>
        </form>
    </div>
</main>
</body>
</html>
