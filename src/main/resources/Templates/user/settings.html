<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .font-poppins { font-family: 'Poppins', sans-serif; }
    /* Custom Colors for consistency */
    .border-teal-500 { border-color: #14B8A6; }
    .text-teal-700 { color: #0F766E; }
    .bg-teal-500 { background-color: #14B8A6; }
    .hover\:bg-teal-600:hover { background-color: #0D9488; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-poppins">

<header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
  <h1 class="text-2xl font-bold text-teal-700">Edit Details</h1>
  <a th:href="@{/user/profile}" class="text-gray-500 hover:text-teal-700 transition">
    <i class="bi bi-arrow-left mr-1"></i> Back to Profile
  </a>
</header>

<main class="container mx-auto p-4 md:p-8">
  <div class="max-w-3xl mx-auto space-y-8">

    <div th:if="${success}" class="p-4 bg-green-100 text-green-700 rounded-lg shadow-md" th:text="${success}">
      Details updated successfully!
    </div>
    <div th:if="${error}" class="p-4 bg-red-100 text-red-700 rounded-lg shadow-md" th:text="${error}">
      Error occurred during update.
    </div>

    <div class="bg-white p-8 rounded-xl shadow-lg border-l-4 border-teal-500">
      <h2 class="text-2xl font-semibold text-teal-700 mb-6 flex items-center gap-2">
        <i class="bi bi-person-lines-fill"></i> Update Contact Info
      </h2>

      <!-- ✅ Updated form with Thymeleaf bindings -->
      <form th:action="@{/user/settings/update-info}" th:object="${user}" method="post" class="space-y-4">

        <input type="hidden" th:field="*{id}" />

        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" th:field="*{name}" id="name"
                 class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input type="tel" th:field="*{phone}" id="phone"
                 class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
        </div>

        <div>
          <label for="address" class="block text-sm font-medium text-gray-700">Primary Location</label>
          <input type="text" th:field="*{address}" id="address"
                 class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
        </div>

        <!-- Read-only Email (but included to prevent nulling) -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email (read-only)</label>
          <input type="email" th:field="*{email}" id="email" readonly
                 class="mt-1 w-full p-3 border border-gray-300 rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed">
        </div>

        <button type="submit"
                class="bg-teal-500 text-white px-5 py-2 rounded-lg font-medium hover:bg-teal-600 transition shadow-md">
          <i class="bi bi-check2 mr-2"></i> Save Information
        </button>
      </form>
    </div>

  </div>
</main>
</body>
</html>
