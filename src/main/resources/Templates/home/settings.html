<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/header :: head (title='User - Settings')}"></head>

<body>
<!-- ✅ Insert Navbar fragment -->
<div th:replace="~{fragments/navbar :: navbar(role='USER')}"></div>

<!-- ✅ Main container, properly opened and closed -->
<div class="container mt-4" sec:authorize="hasRole('USER')">

  <h2>Account Settings</h2>

  <div class="row">
    <div class="col-md-6">

      <h4>Security</h4>

      <!-- ✅ Proper Thymeleaf form binding -->
      <form th:action="@{/user/settings/update-password}" method="post">

        <div class="mb-3">
          <label for="currentPassword" class="form-label">Current Password</label>
          <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6">
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
        </div>

        <button type="submit" class="btn btn-primary">Change Password</button>
      </form>

    </div>
  </div>

</div>

<!-- ✅ Include footer if needed -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
