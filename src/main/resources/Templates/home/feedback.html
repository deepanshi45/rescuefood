<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header.html :: head (title='Submit Feedback')}">
    <link th:href="@{/css/home.css}" rel="stylesheet">
</head>
<body>
<div th:insert="~{fragments/navbar.html :: navbar(role='USER')}"></div>

<div class="container mt-4" sec:authorize="isAuthenticated()">
    <h2>Submit Feedback</h2>
    <p>We value your opinion. Please let us know how we're doing.</p>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/feedback}" th:object="${feedback}" method="post">
        <div class="mb-3">
            <label for="rating" class="form-label">Rating (1-5)</label>
            <select class="form-select" id="rating" th:field="*{rating}" required>
                <option value="">-- Select a rating --</option>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="5" th:field="*{message}" placeholder="Your feedback..." required></textarea>
        </div>

        <input type="hidden" th:field="*{userUsername}" th:value="${#authentication.name}" />

        <button type="submit" class="btn btn-primary">Submit Feedback</button>
    </form>
</div>

<div th:replace="~{fragments/footer.html}"></div>
</body>
</html>
